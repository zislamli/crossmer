<!doctype html>
<html lang="{{language}}" data-site-url="{{siteUrl}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{{seo}}
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon">
<link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon.svg" sizes="any" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
<noscript><style>.menu-toggle{display:none}.header-inner{height:auto;min-height:104px;flex-wrap:wrap;padding-block:20px}.main-nav{display:flex;position:static;flex-wrap:wrap;order:3;width:100%;padding:0;border:0}.form-panel form{display:none}</style></noscript>
</head>
<body>
<a class="skip-link" href="#main">{{skip}}</a>
<div id="site-header">{{header}}</div>
<main id="main" tabindex="-1">{{main}}</main>
{{noScriptContact}}
<div id="site-footer">{{footer}}</div>
</body>
</html>
